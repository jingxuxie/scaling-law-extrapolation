name: Export expansion snapshot

on:
  push:
    branches: [agent/expand-aaai-paper]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: expansion-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
