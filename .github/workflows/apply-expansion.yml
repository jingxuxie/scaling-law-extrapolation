name: Apply paper expansion

on:
  push:
    branches: [agent/expand-aaai-paper]
    paths:
      - ".expansion-patch/READY"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify and apply expansion patch
        shell: bash
        run: |
          set -euo pipefail
          cat .expansion-patch/part-* | base64 --decode | gzip -d > /tmp/expansion.patch
          expected=$(tr -d '[:space:]' < .expansion-patch/READY)
          actual=$(sha256sum /tmp/expansion.patch | awk '{print $1}')
          test "$actual" = "$expected"
          git apply --check /tmp/expansion.patch
          git apply --index /tmp/expansion.patch
          git rm -r .expansion-patch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate expanded paper
        env:
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
          python experiments/run_all.py
          git checkout -- results/certificate_coverage.csv results/hidden_crossover.csv results/matched_floor_exponent.csv results/single_power_fit.csv
          make -C paper all preflight
      - name: Commit expanded sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "paper: expand theory, experiments, and related work"
          git push origin HEAD:${{ github.ref_name }}
