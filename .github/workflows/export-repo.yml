name: Export repository snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
