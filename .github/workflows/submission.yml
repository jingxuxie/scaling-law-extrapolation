name: submission experiments and paper

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [continuous, ols, synthetic, public]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run isolated submission stage
        env:
          SYNTHETIC_REPETITIONS: "30"
          BOOTSTRAP_REPETITIONS: "20"
          OLS_REPETITIONS: "5000"
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python experiments/run_submission.py --stage "${{ matrix.stage }}"
      - name: Upload stage outputs
        uses: actions/upload-artifact@v4
        with:
          name: submission-${{ matrix.stage }}
          path: |
            results/
            paper/figures/
          if-no-files-found: error
          retention-days: 7

  paper:
    needs: experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Generate exact-construction figures
        run: python experiments/run_all.py
      - name: Download submission-stage outputs
        uses: actions/download-artifact@v4
        with:
          pattern: submission-*
          merge-multiple: true
      - name: Compile manuscript, supplement, and checklist
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main.tex
            supplement.tex
            checklist.tex
          working_directory: paper
          work_in_root_file_dir: true
          texlive_version: 2025
        env:
          TEXINPUTS: ".:../AAAI_AuthorKit27//:"
          BSTINPUTS: ".:../AAAI_AuthorKit27//:"
      - name: PDF and log preflight
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pages=$(pdfinfo paper/main.pdf | awk '/Pages/{print $2}')
          test "$pages" -le 7
          for file in paper/main.pdf paper/supplement.pdf paper/checklist.pdf; do
            if pdffonts "$file" | grep -q 'Type 3'; then
              echo "Type-3 font detected in $file"
              exit 1
            fi
          done
          ! grep -Eq 'Overfull|undefined references|Citation.*undefined|Reference.*undefined' \
            paper/main.log paper/supplement.log paper/checklist.log
      - name: Upload submission package
        uses: actions/upload-artifact@v4
        with:
          name: submission-package
          path: |
            paper/main.pdf
            paper/supplement.pdf
            paper/checklist.pdf
            paper/figures/*.pdf
            results/*.csv
          if-no-files-found: error
          retention-days: 14
