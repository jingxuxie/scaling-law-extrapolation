name: submission experiments

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [continuous, ols, synthetic, public]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run isolated submission stage
        env:
          SYNTHETIC_REPETITIONS: "30"
          BOOTSTRAP_REPETITIONS: "20"
          OLS_REPETITIONS: "5000"
          PYTHONHASHSEED: "0"
        run: python experiments/run_submission.py --stage "${{ matrix.stage }}"
      - name: Upload stage outputs
        uses: actions/upload-artifact@v4
        with:
          name: submission-${{ matrix.stage }}
          path: |
            results/
            paper/figures/
            data/public/
          if-no-files-found: error
          retention-days: 7
